name: Deploy Crafted Leaves to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies & build production bundle
        run: |
          npm ci || npm install
          npm run build

      - name: 🚀 Deploy to DigitalOcean Droplet via Rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: "/home/craftedleaves.com/public_html"
          EXCLUDE: "/.git*"
          SCRIPT_AFTER: |
            OWNER=$(stat -c '%U:%G' /home/craftedleaves.com/public_html)
            chown -R $OWNER /home/craftedleaves.com/public_html/
            chmod -R 755 /home/craftedleaves.com/public_html/
            systemctl restart lsws

